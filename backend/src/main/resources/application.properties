spring.application.name=backend

spring.datasource.url=jdbc:sqlite:carona.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Em produção, defina JWT_SECRET (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:dev-secret-troque-isso-em-producao-0123456789}
app.jwt.expiration=24h

app.timezone=America/Sao_Paulo

# Trajetos pelas ruas (servidor público do OSRM). Deixe vazio para usar linha reta.
app.routing.osrm-url=${OSRM_URL:https://router.project-osrm.org}

# Fotos de perfil: uma por usuário, com o id como nome do arquivo (ex.: avatars/42.jpg)
app.avatars.dir=${AVATARS_DIR:avatars}
app.avatars.max-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Confirmação de presença: abre 3 h antes da saída e fecha 30 min antes; quem não confirma perde a vaga
app.rides.confirmation-opens-before=3h
app.rides.confirmation-deadline-before=30m
# Rastreamento do carro e conferência dos códigos de embarque: de 30 min antes da saída até 6 h depois
app.rides.tracking-starts-before=30m
app.rides.tracking-max-duration=6h
