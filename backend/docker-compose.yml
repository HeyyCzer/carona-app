# Sobe a API no Coolify (build pack "Docker Compose", base directory /backend).
# O domínio é configurado no Coolify, apontando para a porta 8080 do serviço "api".
services:
  api:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Obrigatório, mínimo 32 caracteres
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      # Deixe vazio para calcular os trajetos em linha reta
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      # O banco SQLite fica no volume para não ser perdido a cada deploy
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/carona.db
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    volumes:
      - carona-data:/data

volumes:
  carona-data:
